name: ci

on:
  push:
    branches: [master]
  pull_request:

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install frontend deps
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Verify scripts (transcript / interaction / delivery)
        run: npm run verify
      - name: Rust tests
        run: cargo test
        working-directory: src-tauri
      - name: Frontend build
        run: npm run build
      - name: Rust debug build (bad-input fixtures run in debug)
        run: cargo build
        working-directory: src-tauri
