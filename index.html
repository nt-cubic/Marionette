<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/src/marionette-logo.png" />
    <title>Marionette</title>
    <script>
      try {
        var t = localStorage.getItem("marionette-theme") || localStorage.getItem("agentshell-theme");
        // Only 浅夜 / 纯白 remain; retired dark / light map onto them.
        if (t === "light") t = "white";
        else if (t !== "white") t = "dim";
        document.documentElement.setAttribute("data-theme", t);
        document.documentElement.style.colorScheme = t === "white" ? "light" : "dark";
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
