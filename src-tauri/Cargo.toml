[package]
name = "marionette"
version = "0.1.0"
description = "Marionette — agent harness, all in one. Lightweight local shell for multiple agent CLIs."
authors = ["Marionette"]
edition = "2021"
license = "MIT"
repository = ""
default-run = "marionette"
build = "build.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", default-features = false, features = ["wry", "devtools"] }
agent-client-protocol-schema = "1.4.0"
ureq = { version = "2", features = ["json"] }
# Codex keeps its MCP servers in config.toml
toml = "0.8"

[profile.release]
strip = true
lto = true
codegen-units = 1
opt-level = "z"

