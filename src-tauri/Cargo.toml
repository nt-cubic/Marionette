[package]
name = "marionette"
version = "0.2.2"
description = "Marionette — agent harness, all in one. Lightweight local shell for multiple agent CLIs."
authors = ["Marionette"]
edition = "2021"
license = "MIT"
repository = "https://github.com/nt-cubic/Marionette"
default-run = "marionette"
build = "build.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

# SIZE BUDGET (portable Windows x64):
#   Uncompressed release (LTO+strip+opt-z, ring-less TLS): ~7 MB
#   After UPX --best --lzma (see build-portable.bat): ~1.2–1.3 MB  ← product target
#   Keep TLS as ureq + native-tls (Windows schannel). NEVER reintroduce ring/rustls.
#   Do NOT add: tokio, zip/tar extractors, reqwest, download caches, extra UI crates.
#   Agents stay on PATH + npm auto-update — never embed agent binaries.
[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# default-features off — no tray/compression bloat
tauri = { version = "2", default-features = false, features = ["wry", "protocol-asset"] }
# Typed session/new only; do not pull full ACP SDK / async stack
agent-client-protocol-schema = "1.4.0"
# Small blocking HTTP (usage + npm version + app update). No tokio.
ureq = { version = "2", features = ["json", "native-tls"], default-features = false }
# Codex keeps its MCP servers in config.toml
toml = "0.8"
# Native folder picker for "Add project" (no tauri dialog plugin).
rfd = "0.15"
base64 = "0.22"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_Globalization",
  "Win32_System_Registry",
  "Win32_System_Threading",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(not(windows))'.dependencies]
# flock(2) for the single-instance lock (advisory, auto-released on exit/crash).
libc = "0.2"

[features]
default = []
# Enable with: cargo run --features devtools  /  tauri dev still works via debug asserts path if needed
devtools = ["tauri/devtools"]

[profile.release]
strip = true
lto = true
codegen-units = 1
opt-level = "z"
panic = "abort"
# No incremental artifacts in release; slightly tighter final link.
incremental = false

