[package]
name = "marionette"
version = "0.1.0"
description = "Marionette — agent harness, all in one. Lightweight local shell for multiple agent CLIs."
authors = ["Marionette"]
edition = "2021"
license = "MIT"
repository = ""
default-run = "marionette"
build = "build.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# devtools only in debug — keeps the portable release exe smaller
tauri = { version = "2", default-features = false, features = ["wry"] }
agent-client-protocol-schema = "1.4.0"
ureq = { version = "2", features = ["json", "native-tls"], default-features = false }
# Codex keeps its MCP servers in config.toml
toml = "0.8"
# Native folder picker for "Add project" (no tauri dialog plugin).
rfd = "0.15"
base64 = "0.22"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_Globalization",
  "Win32_System_Registry",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }

[features]
default = []
# Enable with: cargo run --features devtools  /  tauri dev still works via debug asserts path if needed
devtools = ["tauri/devtools"]

[profile.release]
strip = true
lto = true
codegen-units = 1
opt-level = "z"
panic = "abort"

