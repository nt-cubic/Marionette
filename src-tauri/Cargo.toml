[package]
name = "marionette"
version = "0.8.5"
description = "Marionette — agent harness, all in one. Lightweight local shell for multiple agent CLIs."
authors = ["Marionette"]
edition = "2021"
license = "MIT"
repository = "https://github.com/nt-cubic/Marionette"
default-run = "marionette"
build = "build.rs"

# 开发/测试二进制：进程内引擎网关的 exe 形态（合同套件驱动它验收）。
# 不进发布产物——正式形态由 engine.rs 在主进程内拉起网关。
[[bin]]
name = "marionette-engine"
path = "src/engine_gateway_bin.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

# SIZE BUDGET (portable Windows x64, 2026-10-30 seed numbers):
#   shell (LTO+strip+opt-z, ring-less TLS): ~5.8 MB
#   frontend dist (shiki curated 36 langs + JS regex engine): ~11 MB (was 19)
#   embedded engine seed (slim gateway-only magpie, tools/magpie-seed):
#     raw ~38 MB → UPX ~12 MB (full magpie would be ~58 → ~19.6)
#   raw release ≈ 27.7 MB → ship after UPX --best --lzma ≈ 15.9 MB.
#   The seed payload is at its compression entropy floor (UPX == xz == xz+BCJ,
#   measured) — it grows with magpie upstream's gateway/provider code only.
#   Keep TLS as ureq + native-tls (Windows schannel). NEVER reintroduce ring/rustls.
#   Do NOT add: tokio, zip/tar extractors, reqwest, download caches, extra UI crates.
#   Agents stay on PATH + npm auto-update — never embed agent binaries.
[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
chrono = { version = "0.4", default-features = true }
# default-features off — no compression bloat；tray-icon 为后台常驻的托盘驻留
# （2026-10-31：× 行为可选「后台常驻」后，右下角需要图标承担唤回/退出）
tauri = { version = "2", default-features = false, features = ["wry", "protocol-asset", "tray-icon"] }
# Typed session/new only; do not pull full ACP SDK / async stack
agent-client-protocol-schema = "1.4.0"
# Small blocking HTTP (usage + npm version + app update). No tokio.
ureq = { version = "2", features = ["json", "native-tls"], default-features = false }
# grok 方言规整器的环回 HTTP 服务（同步、std 线程，无异步运行时）
tiny_http = "0.12"
# Codex keeps its MCP servers in config.toml
toml = "0.8"
# Native folder picker for "Add project" (no tauri dialog plugin).
rfd = "0.15"
# OpenCode / Hermes external session stores (read-only).
rusqlite = { version = "0.32", features = ["bundled"] }
base64 = "0.22"
# Engine download SHA256 verification (already in the graph via tauri/tao — zero size cost).
sha2 = "0.10"
# Computer Use: the global Stop shortcut (revoke everything + halt driver).
tauri-plugin-global-shortcut = "2"
# Only to reach the vendored wry text-drag hook (see [patch.crates-io] note).
wry = { path = "vendor/wry", default-features = false }
# Browser-tab screenshot shrink loop (decode → narrow → re-encode, codeg capture.rs shape).
# webp：解码用（engine_gateway/bodyprep.rs 的 webp→PNG 转码；编码 feature 不加
# ——同一 crate 的 feature，不算新依赖）。
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
# Token-usage history backfill: DSH session logs are zstd-compressed JSONL
# (pure-Rust decoder, no C bindings, streams multi-frame archives).
ruzstd = "0.7"
# Antigravity trajectory store decode: hand-declared protobuf subset at the
# field numbers verified against agy-acp-server 1.5.0 (see
# docs/research/research-antigravity.md §五 + parsers/antigravity.rs).
prost = { version = "0.13", features = ["derive"] }
# Inbound request-body gzip for the in-process engine gateway (Go gateway decodes
# gzip/zstd). Already linked transitively (png); same pure-Rust miniz_oxide backend.
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_Globalization",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Gdi",
  "Win32_Media_Audio",
  "Win32_Security_Cryptography",
  "Win32_System_DataExchange",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_JobObjects",
  "Win32_System_Memory",
  "Win32_System_Ole",
  "Win32_System_ProcessStatus",
  "Win32_System_Registry",
  "Win32_System_Threading",
  "Win32_Storage_FileSystem",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }
# Browser tab (batch 2): CDP isolated-world injection on the child webviews we
# create through the vendored wry. Versions must match what wry 0.55.1 uses
# (Cargo.lock: webview2-com 0.38.2 / windows 0.61.3) or the COM types diverge.
webview2-com = "0.38.2"
windows = { version = "0.61.3", features = [
  "Win32_Foundation",
  "Win32_System_Com",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }

[features]
default = ["engine-rust"]
# Enable with: cargo run --features devtools  /  tauri dev still works via debug asserts path if needed
devtools = ["tauri/devtools"]
# 单 exe 内置引擎（产品定稿 2026-10-16）：third_party/magpie 编出的 nogui
# magpie 经 tools\build-portable.bat **UPX 压缩后**直嵌（~13.6MB，
# 自解压、运行时零解码），离线落位安装。构建前必须先由构建脚本生成
# src-tauri/engine-embedded/magpie-windows-amd64.exe（UPX 后）与 VERSION
# （gitignored 产物，见 tools/README.md）。
embedded-engine = []
# 引擎 Rust 化（docs/plan-engine-rust.md T6）：开启后 engine.rs 的 serve 路径
# 不再 spawn magpie.exe，改在本进程后台线程跑 engine_gateway::httpd；
# run_magpie_cli 家族直调 engine_gateway::cli（无子进程、无 10s 超时）。
# 默认开启（2026-11-19 产品转正）。Magpie 回退 SKU 使用
# `MARIONETTE_ENGINE=magpie --features embedded-engine`；dev 回退设同一环境变量、
# 不启用 embedded feature，走本机下载/复用路径。
# `build.rs` 派生 `engine_rust_active`：默认取 Rust；`MARIONETTE_ENGINE=magpie`
# 或启用 embedded-engine 时自动让位。Tauri CLI 没有 --no-default-features，
# 因此不要恢复成两个 feature 的 compile_error 互斥写法。
engine-rust = []

# tao 0.35.3 asserts that WM_PAINT on the thread-event-target is never re-entrant.
# CJK IME (especially Chinese IME on a Japanese OS) pumps nested messages on
# focus/click and trips that assert → process abort (tao#1140 / tauri#14088).
# Patched copy honors the function's own "return false if re-entrant" contract.
# Drop when tauri ships tao 0.36+ (subclassing removed, #1231).
#
# wry 0.55.1 drops OLE text drags (no CF_HDROP → DragEnter emits nothing) while
# WebView2 HTML5 external drop is disabled — text/link drags from other apps
# never reach the page. Patched copy forwards them through a text hook
# (vendor/wry/MARIONETTE-PATCH.md). Drop when upstream ships text drag events.
[patch.crates-io]
tao = { path = "vendor/tao" }
wry = { path = "vendor/wry" }

[profile.release]
strip = true
lto = true
codegen-units = 1
opt-level = "z"
panic = "abort"
# No incremental artifacts in release; slightly tighter final link.
incremental = false

