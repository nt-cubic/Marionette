[package]
name = "marionette"
version = "0.5.6"
description = "Marionette — agent harness, all in one. Lightweight local shell for multiple agent CLIs."
authors = ["Marionette"]
edition = "2021"
license = "MIT"
repository = "https://github.com/nt-cubic/Marionette"
default-run = "marionette"
build = "build.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

# SIZE BUDGET (portable Windows x64, 2026-10-30 seed numbers):
#   shell (LTO+strip+opt-z, ring-less TLS): ~5.8 MB
#   frontend dist (shiki curated 36 langs + JS regex engine): ~11 MB (was 19)
#   embedded engine seed (slim gateway-only magpie, tools/magpie-seed):
#     raw ~38 MB → UPX ~12 MB (full magpie would be ~58 → ~19.6)
#   raw release ≈ 27.7 MB → ship after UPX --best --lzma ≈ 15.9 MB.
#   The seed payload is at its compression entropy floor (UPX == xz == xz+BCJ,
#   measured) — it grows with magpie upstream's gateway/provider code only.
#   Keep TLS as ureq + native-tls (Windows schannel). NEVER reintroduce ring/rustls.
#   Do NOT add: tokio, zip/tar extractors, reqwest, download caches, extra UI crates.
#   Agents stay on PATH + npm auto-update — never embed agent binaries.
[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# default-features off — no compression bloat；tray-icon 为后台常驻的托盘驻留
# （2026-10-31：× 行为可选「后台常驻」后，右下角需要图标承担唤回/退出）
tauri = { version = "2", default-features = false, features = ["wry", "protocol-asset", "tray-icon"] }
# Typed session/new only; do not pull full ACP SDK / async stack
agent-client-protocol-schema = "1.4.0"
# Small blocking HTTP (usage + npm version + app update). No tokio.
ureq = { version = "2", features = ["json", "native-tls"], default-features = false }
# grok 方言规整器的环回 HTTP 服务（同步、std 线程，无异步运行时）
tiny_http = "0.12"
# Codex keeps its MCP servers in config.toml
toml = "0.8"
# Native folder picker for "Add project" (no tauri dialog plugin).
rfd = "0.15"
# OpenCode / Hermes external session stores (read-only).
rusqlite = { version = "0.32", features = ["bundled"] }
base64 = "0.22"
# Engine download SHA256 verification (already in the graph via tauri/tao — zero size cost).
sha2 = "0.10"
# Only to reach the vendored wry text-drag hook (see [patch.crates-io] note).
wry = { path = "vendor/wry", default-features = false }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_Globalization",
  "Win32_Security_Cryptography",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_JobObjects",
  "Win32_System_Registry",
  "Win32_System_Threading",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }

[features]
default = []
# Enable with: cargo run --features devtools  /  tauri dev still works via debug asserts path if needed
devtools = ["tauri/devtools"]
# 单 exe 内置引擎（产品定稿 2026-10-16）：third_party/magpie 编出的 nogui
# magpie 经 tools\build-portable.bat **UPX 压缩后**直嵌（~13.6MB，
# 自解压、运行时零解码），离线落位安装。构建前必须先由构建脚本生成
# src-tauri/engine-embedded/magpie-windows-amd64.exe（UPX 后）与 VERSION
# （gitignored 产物，见 tools/README.md）。
embedded-engine = []

# tao 0.35.3 asserts that WM_PAINT on the thread-event-target is never re-entrant.
# CJK IME (especially Chinese IME on a Japanese OS) pumps nested messages on
# focus/click and trips that assert → process abort (tao#1140 / tauri#14088).
# Patched copy honors the function's own "return false if re-entrant" contract.
# Drop when tauri ships tao 0.36+ (subclassing removed, #1231).
#
# wry 0.55.1 drops OLE text drags (no CF_HDROP → DragEnter emits nothing) while
# WebView2 HTML5 external drop is disabled — text/link drags from other apps
# never reach the page. Patched copy forwards them through a text hook
# (vendor/wry/MARIONETTE-PATCH.md). Drop when upstream ships text drag events.
[patch.crates-io]
tao = { path = "vendor/tao" }
wry = { path = "vendor/wry" }

[profile.release]
strip = true
lto = true
codegen-units = 1
opt-level = "z"
panic = "abort"
# No incremental artifacts in release; slightly tighter final link.
incremental = false

